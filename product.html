<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbfaf7" />

    <link rel="shortcut icon" href="images/favicon-32x32.png" type="image/x-icon" />

    <!-- Точные мета-теги подставляет product.js после загрузки товара -->
    <title>Товар — Nutralux</title>
    <meta name="description" content="Витамины и БАДы Nutralux: состав, форма выпуска, схема приёма и заказ." />
    <meta name="author" content="Nutralux" />
    <link rel="canonical" href="https://www.nutralux.com.tr/product.html" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@6.11.0/css/flag-icons.min.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="chat-widget.css" />
  </head>

  <body>
    <!-------------- HEADER -------------->

    <header class="header">
      <a href="index.html#home" class="logo" aria-label="Nutralux — на главную">
        <img src="images/logo-mark.png" alt="" width="32" height="33" />
        <span>Nutralux</span>
      </a>

      <i class="bx bx-menu" id="menu-icon" aria-label="Открыть меню"></i>

      <nav class="navbar" id="primary-nav">
        <a href="index.html#about">О нас</a>
        <a href="index.html#services">Почему мы</a>
        <a href="catalog.html">Каталог</a>
        <a href="index.html#faq">Вопросы</a>
        <a href="catalog-en.html" id="lang-switch" class="lang" aria-label="English version"><span class="fi fi-gb"></span></a>
      </nav>
    </header>

    <main
      id="content"
      data-source="products.json"
      data-catalog-page="catalog.html"
      data-home-page="index.html"
      data-self-page="product.html"
      data-alt-page="product-en.html"
      data-lang="ru"
      data-label-home="Главная"
      data-label-catalog="Каталог"
      data-label-order="Заказать в WhatsApp"
      data-label-back="Вернуться в каталог"
      data-label-related="Часто берут вместе с этим"
      data-label-missing="Товар не найден"
      data-label-missing-text="Возможно, он переименован или больше не представлен в каталоге."
      data-label-note="БАД. Не является лекарственным средством. Перед применением проконсультируйтесь со специалистом."
      data-order-text="Здравствуйте! Хочу заказать:"
      data-trust="Проверенные поставщики|Понятные схемы приёма|Честные этикетки"
    >
      <div class="loading-indicator"><i class="bx bx-loader-alt bx-spin"></i><p>Загружаем товар…</p></div>
    </main>

    <!-------------- FOOTER -------------->

    <footer class="footer">
      <div class="footer-inner">
        <a href="index.html#home" class="footer-brand">
          <img src="images/logo-mark.png" alt="" width="28" height="29" />
          Nutralux
        </a>

        <div class="social-media">
          <a href="https://wa.me/905332452900" target="_blank" rel="noopener" aria-label="WhatsApp Nutralux"><i class="bx bxl-whatsapp"></i></a>
          <a href="https://www.tiktok.com/@nutraluxlife?_t=ZS-8yvEDo3bZth&_r=1" target="_blank" rel="noopener" aria-label="TikTok Nutralux"><i class="bx bxl-tiktok"></i></a>
          <a href="https://t.me/nutralux" target="_blank" rel="noopener" aria-label="Telegram Nutralux"><i class="bx bxl-telegram"></i></a>
          <a href="https://clck.ru/3NQNkm" target="_blank" rel="noopener" aria-label="Instagram Nutralux"><i class="bx bxl-instagram"></i></a>
        </div>

        <div class="footer-text"><p>© 2025 Nutralux</p></div>

        <div class="footer-icon-top">
          <a href="#" aria-label="Наверх"><i class="bx bx-up-arrow-alt"></i></a>
        </div>
      </div>
    </footer>

    <script src="product.js" defer></script>
    <script src="script.js" defer></script>
    <script src="chat-widget.js" defer></script>
  </body>
</html>
