<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbfaf7" />

    <link rel="shortcut icon" href="images/favicon-32x32.png" type="image/x-icon" />

    <!-- Exact meta tags are injected by product.js once the item is loaded -->
    <title>Product — Nutralux</title>
    <meta name="description" content="Nutralux vitamins and supplements: ingredients, form, serving and how to order." />
    <meta name="author" content="Nutralux" />
    <link rel="canonical" href="https://www.nutralux.com.tr/product-en.html" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@6.11.0/css/flag-icons.min.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <!-------------- HEADER -------------->

    <header class="header">
      <a href="index.html#home" class="logo" aria-label="Nutralux — home">
        <img src="images/logo-mark.png" alt="" width="32" height="33" />
        <span>Nutralux</span>
      </a>

      <i class="bx bx-menu" id="menu-icon" aria-label="Open menu"></i>

      <nav class="navbar" id="primary-nav">
        <a href="index.html#about">About</a>
        <a href="index.html#services">Why Nutralux</a>
        <a href="catalog-en.html">Catalog</a>
        <a href="index.html#faq">FAQ</a>
        <a href="catalog.html" id="lang-switch" class="lang" aria-label="Русская версия"><span class="fi fi-ru"></span></a>
      </nav>
    </header>

    <main
      id="content"
      data-source="products-en.json"
      data-catalog-page="catalog-en.html"
      data-home-page="index.html"
      data-self-page="product-en.html"
      data-alt-page="product.html"
      data-lang="en"
      data-label-home="Home"
      data-label-catalog="Catalog"
      data-label-order="Order via WhatsApp"
      data-label-back="Back to catalog"
      data-label-related="Often taken together with this"
      data-label-missing="Product not found"
      data-label-missing-text="It may have been renamed or removed from the catalog."
      data-label-note="Dietary supplement. Not a medicine. Consult a specialist before use."
      data-order-text="Hello! I would like to order:"
      data-trust="Verified suppliers|Same-day dispatch|Transparent labels"
    >
      <div class="loading-indicator"><i class="bx bx-loader-alt bx-spin"></i><p>Loading the product…</p></div>
    </main>

    <!-------------- FOOTER -------------->

    <footer class="footer">
      <div class="footer-inner">
        <a href="index.html#home" class="footer-brand">
          <img src="images/logo-mark.png" alt="" width="28" height="29" />
          Nutralux
        </a>

        <div class="social-media">
          <a href="https://wa.me/905332452900" target="_blank" rel="noopener" aria-label="WhatsApp Nutralux"><i class="bx bxl-whatsapp"></i></a>
          <a href="https://www.tiktok.com/@nutraluxlife?_t=ZS-8yvEDo3bZth&_r=1" target="_blank" rel="noopener" aria-label="TikTok Nutralux"><i class="bx bxl-tiktok"></i></a>
          <a href="https://t.me/nutralux" target="_blank" rel="noopener" aria-label="Telegram Nutralux"><i class="bx bxl-telegram"></i></a>
          <a href="https://clck.ru/3NQNkm" target="_blank" rel="noopener" aria-label="Instagram Nutralux"><i class="bx bxl-instagram"></i></a>
        </div>

        <div class="footer-text"><p>© 2025 Nutralux</p></div>

        <div class="footer-icon-top">
          <a href="#" aria-label="Back to top"><i class="bx bx-up-arrow-alt"></i></a>
        </div>
      </div>
    </footer>

    <!-------------- SUPPORT CHAT -------------->

    <div id="support-chat-widget">
      <div id="support-chat-button">💬</div>

      <div id="support-chat-window">
        <div class="sc-header">
          Nutralux Support
          <span id="sc-close">&times;</span>
        </div>
        <div class="sc-messages" id="sc-messages"></div>
        <div class="sc-input">
          <input type="text" id="sc-input-field" aria-label="Message to support" placeholder="Ask anything about Nutralux..." />
          <button id="sc-send-btn">Send</button>
        </div>
      </div>
    </div>

    <script src="product.js" defer></script>
    <script src="script.js" defer></script>
    <script src="chat-widget.js" defer></script>
  </body>
</html>
